name: Build
on:
  push:
    branches: "**"
    pull_request: {}

permissions:
  contents: write

jobs:
  build:
    name: Build Swift ${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            swift: "6.0"
          - os: macos-14
            swift: "6.0"
          - os: macos-15
            swift: "6.0"
    steps:
    - uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: ${{ matrix.swift }}
    - uses: actions/checkout@v4
    - run: swift build -c release
    - 
      id: binary-path
      run: echo "binary-path=$(swift build --show-bin-path -c release)/SincereMusicText" >> "$GITHUB_OUTPUT"
    - 
      uses: actions/upload-artifact@v4
      with:
        name: SincereMusicText.${{ matrix.os}}
        path: ${{ steps.binary-path.outputs.binary-path }}
    - 
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: ${{ steps.binary-path.outputs.binary-path }}

  test:
    name: Test Swift ${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            swift: "6.0"
          - os: macos-14
            swift: "6.0"
          - os: macos-15
            swift: "6.0"
    steps:
    - uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: ${{ matrix.swift }}
    - uses: actions/checkout@v4
    - run: swift test
